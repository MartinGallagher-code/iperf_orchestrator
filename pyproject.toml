[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iperf-orchestrator"
version = "1.1.0"
description = "Full-mesh iperf2 throughput testing across a fleet, with CSV/pivot/heatmap analysis"
readme = "README.md"
requires-python = ">=3.6"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Martin J. Gallagher" }]
maintainers = [{ name = "Martin J. Gallagher" }]
keywords = [
    "iperf",
    "iperf2",
    "network",
    "throughput",
    "bandwidth",
    "benchmark",
    "mesh",
    "fabric",
    "load-testing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Benchmark",
]

# Only `make-heatmap` needs third-party Python; every other analysis step
# (collect-results, parse-cpu, make-pivot, results-summary) is stdlib-only.
# Installing the package pulls these in so the heatmap works out of the box.
dependencies = [
    "numpy",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/MartinGallagher-code/iperf_orchestrator"
Repository = "https://github.com/MartinGallagher-code/iperf_orchestrator"
Issues = "https://github.com/MartinGallagher-code/iperf_orchestrator/issues"
Changelog = "https://github.com/MartinGallagher-code/iperf_orchestrator/blob/main/CHANGELOG.md"

[project.scripts]
iperf-orchestrator = "iperf_orchestrator.cli:main"
matrix-agent = "matrix_agent.matrix_agent:main"

[tool.setuptools]
packages = ["iperf_orchestrator", "matrix_agent"]

# Ship the bash scripts inside the wheel: the orchestrator so the
# console-script wrapper can exec it, and fleet.sh so the `matrix`
# subcommand works out of the box from a pip install (the orchestrator
# finds it at site-packages/matrix_agent/fleet.sh via its ../matrix_agent
# search path).
[tool.setuptools.package-data]
iperf_orchestrator = ["iperf_orchestrator.sh"]
matrix_agent = ["fleet.sh"]
