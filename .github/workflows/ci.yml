name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims to support, so the floor in
        # pyproject.toml's requires-python is actually exercised.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    name: test (python ${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install Python analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib

      - name: Run bash test suite
        run: ./tests/run_tests.sh
