name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib

      - name: Install kcov (bash coverage)
        run: sudo apt-get update && sudo apt-get install -y kcov

      # The test suite is bash (tests/*.sh). Run it under kcov so we get a
      # real coverage report for the orchestrator script and the tests.
      - name: Run test suite with coverage
        run: |
          mkdir -p coverage
          kcov \
            --include-path="$PWD/iperf_orchestrator,$PWD/tests" \
            coverage \
            ./tests/run_tests.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
