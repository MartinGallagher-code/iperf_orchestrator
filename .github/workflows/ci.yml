name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest became 26.04 in November 2026 and setup-python has no 3.9 for it (quarterdeck QD-014 did the same).
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Every version the hosted runners still provide. The declared floor
        # is 3.6, which setup-python can no longer install (3.6/3.7/3.8 were
        # dropped along with the ubuntu-20.04 image), so the bottom of the
        # supported range is executed by the `python-floor` job below in a
        # container instead. Between them: 3.6 and 3.9-3.13 actually run, and
        # the vermin scan statically covers 3.7/3.8.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    name: test (python ${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install Python analysis dependencies
        run: python -m pip install --upgrade pip numpy matplotlib

      - name: Run bash test suite
        run: ./tests/run_tests.sh

      # The same suite again, with every fake host's remote commands really
      # run (install_sandbox_ssh in tests/test_helper.bash), so a test that
      # only reads a command's text also exercises what the command does.
      # Once is enough: the sandbox exercises bash, not Python.
      - name: Run bash test suite on the sandbox ssh
        if: matrix.python-version == '3.13'
        run: ./tests/run_tests.sh --sandbox

  # Guards the `requires-python = ">=3.6"` floor in pyproject.toml. The
  # analysis steps live in heredocs inside iperf_orchestrator.sh, so they get
  # extracted before scanning -- see tests/check_python_compat.sh.
  python-floor:
    name: Python 3.6 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches stdlib APIs newer than the floor (e.g. statistics.fmean, 3.8),
      # which a syntax-only compile check cannot see.
      - name: Scan for post-3.6 syntax and stdlib APIs
        run: |
          python -m pip install --upgrade vermin
          ./tests/check_python_compat.sh --extract-to "$RUNNER_TEMP/pyblocks"
          vermin --eval-annotations --violations --target=3.6 \
            "$RUNNER_TEMP/pyblocks"/*.py iperf_orchestrator/*.py

      # GitHub's hosted runners no longer offer a 3.6 toolchain (it only ever
      # shipped for the retired ubuntu-20.04 image), so use the container
      # instead. Checkout runs on the host, so no node20-on-buster problem.
      - name: Byte-compile and run the suite under real Python 3.6
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.6-slim \
            bash -euxc './tests/check_python_compat.sh && ./tests/run_tests.sh'

      # The wheel is built by modern setuptools (>=77) and so carries PEP 639
      # Metadata-Version 2.4 license metadata, which postdates the newest pip
      # that runs on 3.6 (21.3.1). Install the real artifact with that real pip
      # to prove the metadata is still readable there. --no-deps keeps this
      # about our metadata rather than numpy/matplotlib's 3.6 backsolve.
      - name: Install the built wheel with Python 3.6's pip
        run: |
          python -m pip install --upgrade build
          python -m build --wheel -o dist/
          docker run --rm -v "$PWD:/w" -w /w python:3.6-slim \
            bash -euxc '
              pip --version
              pip install --no-deps dist/*.whl
              iperf-orchestrator --version
              python -m iperf_orchestrator --version
            '

  # Read the Docs builds the same way on its own infrastructure, but only
  # after a merge -- by which point a broken include is already on main.
  # Build it here too, with the same fail-on-warning setting, so a README
  # edit that empties a page fails the pull request instead.
  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches build.tools.python in .readthedocs.yaml. Unrelated to
          # the orchestrator's own 3.6 floor: nothing in docs/ ships.
          python-version: "3.12"

      - name: Install the documentation toolchain
        run: python -m pip install --upgrade pip -r docs/requirements.txt

      - name: Build the documentation
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      - name: Upload the rendered site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7

  # Every change moves the version (shared_tools BN-002). The first step fails
  # when pyproject.toml, iperf_orchestrator/__init__.py and ORCH_VERSION in
  # iperf_orchestrator.sh disagree, or CHANGELOG.md does not open with that
  # version, numbered and dated. On a pull request the second fails unless the
  # version is greater than the base branch's; on a push to main the third
  # fails unless it is greater than what main had before the push.
  # tests/check_version.sh is shared_tools' templates/check_version.sh with
  # this repository's places.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every place the version is written agrees
        run: bash tests/check_version.sh
      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash tests/check_version.sh FETCH_HEAD
      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          bash tests/check_version.sh FETCH_HEAD
